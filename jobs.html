<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="description" content="Explore job openings at the Canton Foundation and apply online.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site-chrome.css?v=footer-20260820e">
  <script src="assets/site-chrome.js?v=footer-20260820e" defer></script>
  <title>Jobs | Canton Foundation</title>
  <style>
    :root {
      --text: #f7f8fc;
      --muted: #d6d0e5;
      --line: rgba(127, 91, 188, 0.24);
      --accent-strong: #f3ff97;
    }

    html {
      min-height: 100%;
      background: #06014a;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 18px 56px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 78% 18%, rgba(129, 84, 120, 0.42), transparent 26%),
        radial-gradient(circle at 18% 80%, rgba(63, 21, 172, 0.18), transparent 34%),
        linear-gradient(180deg, #05014a 0%, #14045a 54%, #090221 100%);
      color: var(--text);
      font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    .jobs-wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    .jobs-panel {
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(6, 4, 30, 0.92);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    .jobs-back {
      color: var(--accent-strong);
      text-underline-offset: 4px;
    }

    .jobs-back {
      display: inline-block;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .jobs-intro h1 {
      margin: 0 0 14px;
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .jobs-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .job-opening {
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .job-opening h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 30px);
      line-height: 1.2;
    }

    .job-opening .job-meta {
      margin-bottom: 12px;
      color: var(--accent-strong);
      font-size: 15px;
      font-weight: 500;
    }

    .job-apply-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 24px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--accent-strong);
      color: #030206;
      text-decoration: none;
      font-size: 15px;
    }

    .jobs-panel :focus-visible {
      outline: 2px solid var(--accent-strong);
      outline-offset: 5px;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 14px 36px;
      }

      .jobs-panel {
        padding: 24px 16px;
        border-radius: 22px;
      }

      .jobs-panel p {
        font-size: 16px;
      }

    }
  </style>
</head>
<body>
  <div data-site-header></div>
  <main class="jobs-wrap">
    <section class="jobs-panel" aria-labelledby="jobs-title">
      <a class="jobs-back" href="index.html">Back to Main Page</a>
      <div class="jobs-intro">
        <h1 id="jobs-title">Jobs</h1>
        <p>Explore opportunities to join the Canton Foundation. Select an opening to read more and apply.</p>
      </div>

      <section class="job-opening" aria-labelledby="accounting-manager-title">
        <h2 id="accounting-manager-title">Accounting Manager</h2>
        <p class="job-meta">Finance &middot; Remote</p>
        <p>Help manage the Foundation's accounting and finance operations, working with our CFO and outsourced accounting firm.</p>
        <a class="job-apply-link" href="accounting-manager.html">View role &amp; apply</a>
      </section>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
