<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site-chrome.css?v=footer-20260820c">
  <script src="assets/site-chrome.js?v=footer-20260820c" defer></script>
  <title>Public Calendar | Canton Network</title>

  <style>
    :root {
      --bg: #06014a;
      --panel: rgba(6, 4, 30, 0.92);
      --panel-soft: rgba(11, 8, 40, 0.82);
      --text: #f7f8fc;
      --muted: #d6d0e5;
      --line: rgba(127, 91, 188, 0.24);
      --accent: #d5a5e3;
      --accent-strong: #f3ff97;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 78% 18%, rgba(129, 84, 120, 0.42), transparent 26%),
        radial-gradient(circle at 18% 80%, rgba(63, 21, 172, 0.18), transparent 34%),
        linear-gradient(180deg, #05014a 0%, #14045a 54%, #090221 100%);
      color: var(--text);
      font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      padding: 36px 18px 56px;
      box-sizing: border-box;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    .panel {
      padding: 48px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(213, 165, 227, 0.14);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 16px;
      max-width: 820px;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    p {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 28px;
    }

    .button,
    .button-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .button {
      background: var(--accent-strong);
      color: #132019;
    }

    .button-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(186, 252, 104, 0.3);
    }

    .button:hover,
    .button-secondary:hover {
      transform: translateY(-2px);
    }

    .calendar-card {
      margin-top: 34px;
      padding: 18px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(17, 11, 55, 0.98), rgba(10, 7, 36, 0.98));
      border: 1px solid rgba(126, 92, 186, 0.28);
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.24);
    }

    .calendar-frame {
      width: 100%;
      height: min(78vh, 760px);
      min-height: 560px;
      display: block;
      border: 0;
      border-radius: 18px;
      background: #ffffff;
    }

    .note {
      margin-top: 18px;
      padding: 18px 20px;
      border-radius: 18px;
      background: var(--panel-soft);
      border: 1px solid rgba(126, 92, 186, 0.2);
    }

    .note p {
      font-size: 15px;
    }

    .note a {
      color: var(--accent-strong);
      font-weight: 700;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px 14px 36px;
      }

      .panel {
        padding: 28px 22px;
        border-radius: 22px;
      }

      p {
        font-size: 16px;
      }

      .actions {
        display: grid;
      }

      .calendar-card {
        padding: 10px;
        border-radius: 20px;
      }

      .calendar-frame {
        min-height: 520px;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <div data-site-header></div>
  <main class="wrap">
    <section class="panel">
      <div class="eyebrow">Calendar</div>
      <h1>Public Calendar</h1>
      <p>
        View upcoming public Canton Foundation events, meetings, and ecosystem dates in Eastern Time.
      </p>

      <div class="actions">
        <a class="button" href="https://calendar.google.com/calendar/embed?src=c_91134bfb7db11c333eb89ae80e9823b86fa3c15b793c43d2f9aef8e7a3ce0e31%40group.calendar.google.com&ctz=America%2FNew_York" target="_blank" rel="noopener">Open Calendar</a>
        <a class="button-secondary" href="index.html">Back to Main Page</a>
      </div>

      <div class="calendar-card">
        <iframe
          class="calendar-frame"
          title="Canton Foundation Public Calendar"
          src="https://calendar.google.com/calendar/embed?src=c_91134bfb7db11c333eb89ae80e9823b86fa3c15b793c43d2f9aef8e7a3ce0e31%40group.calendar.google.com&ctz=America%2FNew_York">
        </iframe>
      </div>

      <div class="note">
        <p>
          If the embedded calendar does not load in your browser, use the
          <a href="https://calendar.google.com/calendar/embed?src=c_91134bfb7db11c333eb89ae80e9823b86fa3c15b793c43d2f9aef8e7a3ce0e31%40group.calendar.google.com&ctz=America%2FNew_York" target="_blank" rel="noopener">direct Google Calendar link</a>.
        </p>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
